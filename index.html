    margin: -16px 0 20px;
    text-align: right;
  }
  .placeholder {
    font-size: 13px;
    color: #c0392b;
    text-align: center;
    padding: 12px 0;
  }
  .result-header {
    display: flex;
    align-items: center;
    gap: 16px;
    border-radius: 14px 14px 0 0;
    padding: 24px 20px;
    text-align: center;
    background: linear-gradient(180deg, var(--theme-color-pale) 0%, transparent 100%), var(--panel-bg);
    transition: background 0.4s ease;
  }
  .result-header-info {
    flex: 1;
    min-width: 0;
  }
  .result-header-illustration {
    flex-shrink: 0;
    width: 40%;
    max-width: 150px;
    border-radius: 10px;
    overflow: hidden;
    box-shadow: 0 4px 14px rgba(0,0,0,0.14);
  }
  .result-header-illustration img {
    display: block;
    width: 100%;
    height: auto;
  }
  .swatch-hero {
    width: 64px;
    height: 64px;
    border-radius: 50%;
    margin: 0 auto 12px;
    border: 3px solid #fff;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
    background: var(--theme-color);
    transition: background 0.4s ease;
  }
  .result-main-body {
    background: var(--panel-bg);
    border-radius: 0 0 14px 14px;
    padding: 20px;
    margin-bottom: 12px;
  }
  .label-small {
    font-size: 12px;
    color: #888;
    margin: 0 0 2px;
  }
  .color-name {
    font-size: 21px;
    font-weight: 600;
    margin: 0;
  }
  .keywords {
    font-size: 13px;
    color: #777;
    margin: 4px 0 0;
  }
  p.line {
    font-size: 14px;
    margin: 0 0 8px;
    line-height: 1.6;
  }
  .grid-2 {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-bottom: 12px;
  }
  .mini-card {
    background: var(--panel-bg);
    border-radius: 12px;
    padding: 14px;
    border-left: 3px solid var(--theme-color);
    transition: border-color 0.4s ease;
  }
  .mini-card p.label-small { margin-bottom: 4px; }
  .mini-card p.mini-text { font-size: 13px; margin: 0; line-height: 1.5; }
  .next-sekki-wrap { text-align: center; }
  .next-sekki {
    font-size: 12px;
    text-align: center;
    color: var(--theme-color-dark);
    background: var(--theme-color-pale);
    border-radius: 20px;
    padding: 6px 14px;
    display: inline-block;
    margin: 0 auto 12px;
    transition: background 0.4s ease, color 0.4s ease;
  }
  .footer-note {
    font-size: 12px;
    color: #999;
    text-align: center;
    margin-top: 4px;
    line-height: 1.6;
  }
  .precision-note {
    font-size: 11px;
    color: #b5b3ac;
    text-align: center;
    margin-top: 14px;
    line-height: 1.6;
  }
  .share-bar {
    margin-top: 18px;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
  }
  .share-bar[hidden] { display: none; }
  .format-toggle {
    display: inline-flex;
    background: #f4f3ef;
    border-radius: 20px;
    padding: 3px;
    gap: 2px;
  }
  .format-btn {
    border: none;
    background: transparent;
    font-size: 12px;
    padding: 6px 14px;
    border-radius: 16px;
    cursor: pointer;
    color: #888;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .format-btn.active {
    background: var(--theme-color);
    color: #fff;
  }
  .copy-btn {
    border: 1px solid var(--theme-color-pale);
    background: #ffffff;
    color: var(--theme-color-dark);
    font-size: 13px;
    font-weight: 600;
    padding: 10px 22px;
    border-radius: 24px;
    cursor: pointer;
    transition: background 0.25s ease, border-color 0.4s ease, color 0.4s ease;
  }
  .copy-btn:hover { background: var(--theme-color-pale); }
  .copy-btn.copied {
    background: var(--theme-color);
    border-color: var(--theme-color);
    color: #fff;
  }
  .theme-toggle {
    position: absolute;
    top: 14px;
    right: 14px;
    display: inline-flex;
    background: #f4f3ef;
    border-radius: 14px;
    padding: 2px;
    gap: 2px;
    z-index: 2;
  }
  .theme-btn {
    border: none;
    background: transparent;
    font-size: 11px;
    padding: 5px 7px;
    border-radius: 10px;
    cursor: pointer;
    color: #888;
    line-height: 1.4;
    transition: background 0.25s ease, color 0.25s ease;
  }
  .theme-btn.active {
    background: var(--theme-color);
    color: #fff;
  }
  @media (max-width: 380px) {
    .card { padding: 24px 18px; }
    .grid-2 { grid-template-columns: 1fr; }
    .result-header { flex-direction: column; }
    .result-header-illustration { width: 60%; max-width: 200px; }
  }
  @media (prefers-color-scheme: dark) {
    :root { --card-overlay: rgba(18,18,22,0.78); --panel-bg: #2a2a2f; }
    body { background: #16161a; color: #e8e6e1; }
    .card { background-color: #202024; }
    label { color: #b0aeaa; }
    input[type="date"] {
      background: #2a2a2f;
      border-color: #3a3a40;
      color: #e8e6e1;
      color-scheme: dark;
    }
    .today-note { color: #8c8a86; }
    .placeholder { color: #e08a7d; }
    .label-small { color: #9c9a96; }
    .color-name { color: var(--theme-color) !important; }
    .keywords { color: #b0aeaa; }
    p.line { color: #e0dedb; }
    .footer-note { color: #8c8a86; }
    .precision-note { color: #6f6d6a; }
    .next-sekki { color: var(--theme-color); }
    .format-toggle { background: #2a2a2f; }
    .format-btn { color: #9c9a96; }
    .copy-btn { background: #2a2a2f; color: var(--theme-color); }
    .theme-toggle { background: #2a2a2f; }
    .theme-btn { color: #9c9a96; }
  }
  /* 手動テーマ切り替え（システム設定より優先） */
  :root[data-theme="dark"] { --card-overlay: rgba(18,18,22,0.78); --panel-bg: #2a2a2f; }
  :root[data-theme="dark"] body { background: #16161a; color: #e8e6e1; }
  :root[data-theme="dark"] .card { background-color: #202024; }
  :root[data-theme="dark"] label { color: #b0aeaa; }
  :root[data-theme="dark"] input[type="date"] {
    background: #2a2a2f;
    border-color: #3a3a40;
    color: #e8e6e1;
    color-scheme: dark;
  }
  :root[data-theme="dark"] .today-note { color: #8c8a86; }
  :root[data-theme="dark"] .placeholder { color: #e08a7d; }
  :root[data-theme="dark"] .label-small { color: #9c9a96; }
  :root[data-theme="dark"] .color-name { color: var(--theme-color) !important; }
  :root[data-theme="dark"] .keywords { color: #b0aeaa; }
  :root[data-theme="dark"] p.line { color: #e0dedb; }
  :root[data-theme="dark"] .footer-note { color: #8c8a86; }
  :root[data-theme="dark"] .precision-note { color: #6f6d6a; }
  :root[data-theme="dark"] .next-sekki { color: var(--theme-color); }
  :root[data-theme="dark"] .format-toggle,
  :root[data-theme="dark"] .theme-toggle { background: #2a2a2f; }
  :root[data-theme="dark"] .format-btn,
  :root[data-theme="dark"] .theme-btn { color: #9c9a96; }
  :root[data-theme="dark"] .copy-btn { background: #2a2a2f; color: var(--theme-color); }

  :root[data-theme="light"] { --card-overlay: rgba(255,255,255,0.85); --panel-bg: #f4f3ef; }
  :root[data-theme="light"] body { background: #f7f6f3; color: #2c2c2a; }
  :root[data-theme="light"] .card { background-color: #ffffff; }
  :root[data-theme="light"] label { color: #666; }
  :root[data-theme="light"] input[type="date"] {
    background: #ffffff;
    border-color: #ddd;
    color: #2c2c2a;
    color-scheme: light;
  }
  :root[data-theme="light"] .today-note { color: #999; }
  :root[data-theme="light"] .placeholder { color: #c0392b; }
  :root[data-theme="light"] .label-small { color: #888; }
  :root[data-theme="light"] .color-name { color: var(--theme-color-dark) !important; }
  :root[data-theme="light"] .keywords { color: #777; }
  :root[data-theme="light"] p.line { color: #2c2c2a; }
  :root[data-theme="light"] .footer-note { color: #999; }
  :root[data-theme="light"] .precision-note { color: #b5b3ac; }
  :root[data-theme="light"] .next-sekki { color: var(--theme-color-dark); }
  :root[data-theme="light"] .format-toggle,
  :root[data-theme="light"] .theme-toggle { background: #f4f3ef; }
  :root[data-theme="light"] .format-btn,
  :root[data-theme="light"] .theme-btn { color: #888; }
  :root[data-theme="light"] .copy-btn { background: #ffffff; color: var(--theme-color-dark); }
</style>
</head>

<div class="card">
  <div class="theme-toggle" id="theme-toggle" role="group" aria-label="表示テーマ">
    <button type="button" class="theme-btn" data-theme-value="auto" title="自動">A</button>
    <button type="button" class="theme-btn" data-theme-value="light">☀️</button>
    <button type="button" class="theme-btn" data-theme-value="dark">🌙</button>

  <div class="share-bar" id="share-bar" hidden>

      <button type="button" class="format-btn" data-format="sns">SNS用短文</button>

</div>

function digitSum(str) {
  let n = str.split('').filter(c => /[0-9]/.test(c)).reduce((a,b) => a + parseInt(b), 0);
  while (n > 9) n = String(n).split('').reduce((a,b) => a + parseInt(b), 0);
  return n;
}

// 太陽黄経の簡易計算式（Meeusの低精度式）
function solarLongitude(date) {
  const jd = date.getTime() / 86400000 + 2440587.5;
  const T = (jd - 2451545.0) / 36525;
  const L0 = 280.46646 + 36000.76983 * T + 0.0003032 * T * T;
  const M = 357.52911 + 35999.05029 * T - 0.0001537 * T * T;
  const Mrad = M * Math.PI / 180;
  const C = (1.914602 - 0.004817 * T - 0.000014 * T * T) * Math.sin(Mrad)
          + (0.019993 - 0.000101 * T) * Math.sin(2 * Mrad)
          + 0.000289 * Math.sin(3 * Mrad);
  const trueLong = L0 + C;
  const omega = 125.04 - 1934.136 * T;
  const lambda = trueLong - 0.00569 - 0.00478 * Math.sin(omega * Math.PI / 180);
  return ((lambda % 360) + 360) % 360;
}

function getSekki(date) {
  const lambda = solarLongitude(date);
  const idx = Math.floor((((lambda - 315) % 360 + 360) % 360) / 15);
  const seasonNames = ['春', '夏', '秋', '冬'];
  const seasonIdx = Math.floor(idx / 6);
  return { idx, name: sekkiList[idx].name, theme: sekkiList[idx].theme, season: seasonNames[seasonIdx] };
}

// 現在の節気の次に切り替わる日までの日数を、日単位で走査して推定する
function nextSekkiInfo(date, currentIdx) {
  const base = new Date(date);
  base.setHours(0, 0, 0, 0);
  for (let i = 1; i <= 20; i++) {
    const nd = new Date(base.getTime() + i * 86400000);
    const idx2 = getSekki(nd).idx;
    if (idx2 !== currentIdx) {
      return { name: sekkiList[idx2].name, days: i };
    }
  }
  return null;
}

function formatDateJp(date) {
  return `${date.getFullYear()}年${date.getMonth() + 1}月${date.getDate()}日`;
}

// 16進カラーに透明度をつける
function withAlpha(hex, alpha) {
  return hex + alpha;
}

let lastResult = null;
let currentFormat = 'detail';

function buildDetailText(r) {
  return `【${r.dateJp}のラッキーカラー診断】\n` +
    `ラッキーカラー：${r.colorName}（${r.keywords}）\n` +
    `この色が示す傾向：${r.trait}\n` +
    `今日の過ごし方のヒント：${r.tip}\n` +
    `パーソナル数：${r.personal}（ライフパス数${r.lifePath}＋今日の数字${r.todayNum}）\n` +
    `季節（${r.season}）／今日の節気：${r.sekkiName}`;
}

function buildSnsText(r) {
  return `✨今日のラッキーカラーは「${r.colorName}」🌈\n${r.keywords}な一日になりそう😊\n${r.tip}\n#今日のラッキーカラー #占い`;
}

// Clipboard APIが使えない環境（file://等）向けのフォールバック
function legacyCopy(text) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.position = 'fixed';
  ta.style.opacity = '0';
  document.body.appendChild(ta);
  ta.focus();
  ta.select();
  let ok = false;
  try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
  document.body.removeChild(ta);
  return ok;
}

async function copyResult() {
  if (!lastResult) return;
  const text = currentFormat === 'sns' ? buildSnsText(lastResult) : buildDetailText(lastResult);
  const btn = document.getElementById('copy-btn');
  let ok = false;

  if (navigator.clipboard && navigator.clipboard.writeText) {
    try {
      await navigator.clipboard.writeText(text);
      ok = true;
    } catch (e) {
      ok = false;
    }
  }
  if (!ok) {
    ok = legacyCopy(text);
  }

  btn.classList.remove('copied');
  if (ok) {
    btn.textContent = 'コピーしました';
    btn.classList.add('copied');
  } else {
    btn.textContent = 'コピーに失敗しました';
  }
  setTimeout(() => {
    btn.textContent = '結果をコピー';
    btn.classList.remove('copied');
  }, 1800);
}

document.querySelectorAll('.format-btn').forEach(btn => {
  btn.addEventListener('click', () => {
    document.querySelectorAll('.format-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    currentFormat = btn.dataset.format;
  });
});
document.getElementById('copy-btn').addEventListener('click', copyResult);

// ライト/ダーク手動切り替え（自動＝システム設定に追従）
function setTheme(mode) {
  if (mode === 'auto') {
    document.documentElement.removeAttribute('data-theme');
  } else {
    document.documentElement.setAttribute('data-theme', mode);
  }
  document.querySelectorAll('.theme-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.themeValue === mode);
  });
}
document.querySelectorAll('.theme-btn').forEach(btn => {
  btn.addEventListener('click', () => setTheme(btn.dataset.themeValue));
});
setTheme('auto');

function render() {
  const bday = document.getElementById('birthday').value;
  const area = document.getElementById('result-area');
  const today = new Date();
  document.getElementById('today-note').textContent = `今日：${formatDateJp(today)}`;

  if (!bday) {
    area.innerHTML = '<p class="placeholder">誕生日を入力してください</p>';
    lastResult = null;
    document.getElementById('share-bar').hidden = true;
    return;
  }

  const todayStr = today.getFullYear() + String(today.getMonth() + 1).padStart(2, '0') + String(today.getDate()).padStart(2, '0');
  const lifePath = digitSum(bday.replace(/-/g, ''));
  const todayNum = digitSum(todayStr);
  let personal = lifePath + todayNum;
  while (personal > 9) personal = String(personal).split('').reduce((a, b) => a + parseInt(b), 0);
  const c = colorMap[personal];
  const sekki = getSekki(today);
  const next = nextSekkiInfo(today, sekki.idx);

  // --- テーマカラーをCSS変数に反映 ---
  document.documentElement.style.setProperty('--theme-color', c.hex);
  document.documentElement.style.setProperty('--theme-color-pale', withAlpha(c.hex, '22'));
  document.documentElement.style.setProperty('--theme-color-dark', c.dark);

  area.innerHTML = `
    <div class="result-header">
      <div class="result-header-info">
        <div class="swatch-hero"></div>
        <p class="label-small">今日のラッキーカラー</p>
        <p class="color-name" style="color:${c.dark};">${c.name}</p>
        <p class="keywords">${c.keywords}</p>
      </div>
      ${c.illustration ? `<div class="result-header-illustration"><img src="${c.illustration}" alt="${c.name}のイメージイラスト"></div>` : ''}
    </div>
    <div class="result-main-body">
      <p class="line"><span style="color:#888; font-size:12px;">この色が示す傾向</span><br>${c.trait}</p>
      <p class="line" style="margin-bottom:0;"><span style="color:#888; font-size:12px;">今日の過ごし方のヒント</span><br>${c.tip}</p>
    </div>
    <div class="grid-2">
      <div class="mini-card">
        <p class="label-small">季節（${sekki.season}）</p>
        <p class="mini-text">${seasonThemes[sekki.season]}</p>
      </div>
      <div class="mini-card">
        <p class="label-small">今日の節気：${sekki.name}</p>
        <p class="mini-text">${sekki.theme}</p>
      </div>
    </div>
    ${next ? `<div class="next-sekki-wrap"><span class="next-sekki">次の節気「${next.name}」まであと${next.days}日</span></div>` : ''}
    <p class="footer-note">ライフパス数 ${lifePath} ＋ 今日の数字 ${todayNum} → パーソナル数 ${personal}</p>
    <p class="precision-note">※節気は太陽黄経の近似式（Meeus低精度式）による計算のため、誤差は数時間程度に収まりますが、節気の切り替わり当日のみ時刻によって前後の節気にまたがる可能性があります。</p>
  `;

  lastResult = {
    dateJp: formatDateJp(today),
    colorName: c.name,
    keywords: c.keywords,
    trait: c.trait,
    tip: c.tip,
    personal, lifePath, todayNum,
    season: sekki.season,
    sekkiName: sekki.name
  };
  document.getElementById('share-bar').hidden = false;
}

document.getElementById('birthday').addEventListener('change', render);
document.getElementById('birthday').addEventListener('input', render);
render();
</script>
</body>
